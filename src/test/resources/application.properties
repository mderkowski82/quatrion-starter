quarkus.arc.selected-alternatives=dev.quatrion.portal.TestPortalModuleConfig
# Disable Hibernate ORM and the reactive datasource in tests (no DB in CI)
quarkus.hibernate-orm.active=false
quarkus.datasource.active=false
# Disable OIDC connectivity in tests (no Keycloak in CI).
# quarkus-test-security still enforces @Authenticated / @RolesAllowed via @TestSecurity.
quarkus.oidc.enabled=false
# Dummy values for required config properties so Quarkus validation passes in tests.
# These are never used because OIDC and Keycloak Admin API are disabled/mocked.
# keycloak.admin.client-secret reads from this property (lowercase property-style).
keycloak.admin.client-secret=test-secret-not-used-in-tests
# portal.license.key ? not set, defaultValue="" activates dev mode

# Suppress noisy Hibernate Reactive / request handler errors in tests.
# RBAC tests intentionally hit data endpoints without a DB ? the resulting 500 is expected
# and not a test concern (tests only verify RBAC layer: not-401, not-403).
quarkus.log.category."dev.quatrion.portal.resource.GenericCrudResource".level=FATAL
quarkus.log.category."org.hibernate.reactive".level=FATAL
quarkus.log.category."org.jboss.resteasy.reactive".level=FATAL
quarkus.log.category."io.quarkus.resteasy.reactive".level=FATAL

