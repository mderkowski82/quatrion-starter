
quarkus.http.port=8080
quarkus.log.level=INFO

# Structured JSON logging - enabled only in production profile
# Dev/test use standard human-readable console output
# NOTE: quarkus.log.console.json (boolean shorthand) was deprecated in Quarkus 3.x
#       → use quarkus.log.console.json.enabled instead
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.additional-field."service".value=quatrion-portal
%prod.quarkus.log.console.json.additional-field."environment".value=${PORTAL_ENV:production}

# Prometheus metrics - available at /q/metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# CDI bean elimination — selectively disabled via @Unremovable on dynamic beans
# (FilterParser, PortalAuditLogService, IamAuditService, action handlers).
# quarkus.arc.remove-unused-beans=false  ← removed: too broad, hurts native image size

# CORS - allow frontend dev server (override PORTAL_CORS_ORIGINS for production deployments)
# NOTE: quarkus.http.cors (boolean shorthand) was deprecated in Quarkus 3.x
#       → use quarkus.http.cors.enabled instead (VertxHttpConfig.corsEnabled)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${PORTAL_CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.access-control-allow-credentials=true

# Reactive PostgreSQL datasource (override via env vars in production)
quarkus.datasource.db-kind=postgresql

# DevServices disabled by default due to Docker Desktop compatibility issues on Windows
# Use manual PostgreSQL container (see README.md)
quarkus.datasource.devservices.enabled=false
quarkus.datasource.reactive.url=${PORTAL_DB_URL:postgresql://localhost:5432/portal}
quarkus.datasource.username=${PORTAL_DB_USER:portal}
quarkus.datasource.password=${PORTAL_DB_PASSWORD:portal}

# ── Hibernate ORM / Reactive ────────────────────────────────────────────────
# Quarkus activates BOTH blocking Hibernate ORM (<default>) and Hibernate
# Reactive (default-reactive) when quarkus-jdbc-postgresql is on the classpath.
# Both see the same JPA entities and the same PostgreSQL DB; schema updates are
# idempotent so two concurrent `update` runs cause no harm.
# Application code uses only Hibernate Reactive (Panache Reactive / Mutiny).
# The blocking ORM persistence unit is inert from the application's perspective
# but must have a valid JDBC URL to activate without error.
#
# JDBC datasource — required by:
#   • blocking Hibernate ORM (auto-activated when quarkus-jdbc-postgresql is present)
#   • Flyway schema migrations (production)
# All application queries go through the reactive datasource (above).
quarkus.datasource.jdbc.url=${PORTAL_DB_JDBC_URL:jdbc:postgresql://localhost:5432/portal}

# Test profile: disable JDBC to avoid creating an Agroal connection pool when
# no real database is needed by unit/mock tests.
%test.quarkus.datasource.jdbc=false

# Schema management
# Dev: auto-update for rapid local iteration
# Prod: validate-only — Flyway is the sole schema authority in production
quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# Physical naming strategy — converts camelCase field names to snake_case column names
# e.g. firstName → first_name, isActive → is_active, orderNumber → order_number
# This is the Hibernate 6 default but we set it explicitly for clarity and safety.
# All Flyway migrations use snake_case column names consistent with this strategy.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway — enabled in production; disabled in dev/test to keep local workflow fast
# baseline-on-migrate=true allows adding Flyway to an existing database without
# re-running V1 on a database that was previously managed by hibernate update mode.
quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.baseline-on-migrate=true
%prod.quarkus.flyway.baseline-version=0
%prod.quarkus.flyway.locations=classpath:db/migration

# Health checks - /q/health, /q/health/live, /q/health/ready
# NOTE: quarkus.smallrye-health.ui.enable was removed in Quarkus 3.x
#       → SmallRyeHealthUIConfig only exposes root-path and always-include
quarkus.smallrye-health.ui.always-include=true

# Test profile - no real DB needed (no JPA entities in framework tests)
%test.quarkus.datasource.devservices.enabled=false

# DevServices profile - for users who want to use DevServices (requires working Testcontainers)
# Use: ./gradlew quarkusDev -Dquarkus.profile=devservices
%devservices.quarkus.datasource.devservices.enabled=true
%devservices.quarkus.datasource.devservices.image-name=postgres:15-alpine
%devservices.quarkus.datasource.devservices.db-name=quatrion
%devservices.quarkus.datasource.devservices.username=quatrion
%devservices.quarkus.datasource.devservices.password=quatrion

# Portal UI configuration - comprehensive demo setup to exercise all UI options

# General
portal.ui.title=Quatrion Demo Portal

# Layout - wider sidebar for two modules with groups
portal.ui.layout.sidebar.width=280
portal.ui.layout.sidebar.collapsible=true
portal.ui.layout.sidebar.default-collapsed=false
portal.ui.layout.content.max-width=1400
portal.ui.layout.top-bar.height=56
# Two modules visible in module selector (CRM + Katalog)
portal.ui.layout.top-bar.show-module-selector=true
portal.ui.layout.top-bar.show-user-menu=true
# Enable search bar
portal.ui.layout.top-bar.show-search=true

# Theme - custom brand palette for visual differentiation
portal.ui.theme.primary-color=#7c3aed
portal.ui.theme.accent-color=#a78bfa
portal.ui.theme.sidebar-bg=#1e1b4b
portal.ui.theme.sidebar-text=#ede9fe
portal.ui.theme.header-bg=#f8f7ff

# Table - enable all table features
portal.ui.table.default-page-size=20
portal.ui.table.show-row-numbers=true
portal.ui.table.enable-export=true
portal.ui.table.sticky-header=true

# Form - xl modal for comfortable multi-tab forms
portal.ui.form.modal-width=xl
portal.ui.form.nested-modal-width=lg
portal.ui.form.show-tab-icons=true
portal.ui.form.auto-save-interval=0

# Filter
portal.ui.filter.position=modal
portal.ui.filter.remember-filters=true
portal.ui.filter.max-filter-fields=30

# Export — Perf 3.2: max rows per single export request (prevents OOM on large tables)
# Override via PORTAL_EXPORT_MAX_ROWS env var or application.properties in your project
portal.export.max-rows=${PORTAL_EXPORT_MAX_ROWS:50000}

# Security - no auth for demo
#portal.ui.security.provider=none
#portal.ui.security.roles-attribute=realm_access.roles

# ── OIDC (Keycloak) ───────────────────────────────────────────────────────────
# Set KEYCLOAK_URL env var to override (e.g. https://keycloak.prod/realms/quatrion)
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/quatrion
quarkus.oidc.client-id=${KEYCLOAK_BACKEND_CLIENT_ID:quatrion-backend}
# DEV default zsynchronizowany z keycloak/realm-export.json — zmień w produkcji przez Vault/env.
# W produkcji ustaw KEYCLOAK_BACKEND_CLIENT_SECRET jako zmienną środowiskową lub sekret Vault.
quarkus.oidc.credentials.secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:quatrion-backend-dev-secret}
# Backend acts as a resource server — validates Bearer tokens issued by Keycloak
quarkus.oidc.application-type=service
# Keycloak puts realm roles under realm_access.roles (nested claim)
# The / separator allows Quarkus to navigate the nested JSON path
quarkus.oidc.roles.role-claim-path=realm_access/roles

# ── Keycloak Admin API (master-realm password grant for IAM operations) ───────
# URL of the Keycloak server (same as OIDC auth-server base).
# Set KEYCLOAK_URL env var for non-localhost environments.
keycloak.admin.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.admin.realm=quatrion
# Master-realm admin credentials used to obtain an admin token via password grant.
# Keycloak 25 Root Cause: client_credentials tokens for service accounts are
# stateless (no user session) → oidc-usermodel-* mappers are skipped →
# realm_access / resource_access claims are absent → Admin REST API returns HTTP 403
# regardless of role assignments.  Using the master realm password grant is the
# reliable workaround (admin-cli + username/password → token includes realm_access.roles).
# In production, set KEYCLOAK_ADMIN_USERNAME / KEYCLOAK_ADMIN_PASSWORD via Vault/secrets.
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
# Keycloak 25+ exposes health endpoints on a separate management port (9000 by default).
# Set KEYCLOAK_MGMT_URL to enable /health/live probing in KeycloakAdminHealthCheck.
# Leave empty to fall back to OIDC realm endpoint (works in all modes).
keycloak.admin.mgmt-url=${KEYCLOAK_MGMT_URL:}


# ── TLS / HTTPS (production) ──────────────────────────────────────────────────
# In production, terminate TLS at the load-balancer/reverse-proxy level (recommended),
# OR configure Quarkus native TLS using the settings below.
#
# To enable native TLS on the Quarkus HTTP server:
#   %prod.quarkus.http.ssl-port=8443
#   %prod.quarkus.http.ssl.certificate.file=/run/secrets/tls.crt
#   %prod.quarkus.http.ssl.certificate.key-file=/run/secrets/tls.key
#   %prod.quarkus.http.insecure-requests=redirect   # HTTP → HTTPS redirect
#
# Certificate sources (choose one):
#   a) Mount TLS cert + key as Docker/K8s secrets (recommended for containers)
#   b) Let's Encrypt + cert-manager (Kubernetes Ingress)
#   c) Quarkus TLS registry: quarkus.tls.key-store.p12.path + .password
#
# For development, TLS is intentionally disabled to avoid self-signed cert issues.

# ── HashiCorp Vault (production secrets) ──────────────────────────────────────
# Secrets (DB password, Keycloak client secret, TLS keys) must NOT be hardcoded
# or stored in .env files in production. Use HashiCorp Vault with AppRole auth.
#
# Required Quarkus extension: io.quarkus:quarkus-vault (add to build.gradle.kts)
#
# Example Vault configuration (activate in production profile):
#   %prod.quarkus.vault.url=https://vault.internal.example.com
#   %prod.quarkus.vault.authentication.app-role.role-id=${VAULT_ROLE_ID}
#   %prod.quarkus.vault.authentication.app-role.secret-id=${VAULT_SECRET_ID}
#   %prod.quarkus.vault.kv-secret-engine-version=2
#   %prod.quarkus.vault.secret-config-kv-path=quatrion/portal
#
# Vault secret path `quatrion/portal` must contain the following keys:
#   PORTAL_DB_PASSWORD                 → quarkus.datasource.password
#   KEYCLOAK_BACKEND_CLIENT_SECRET     → quarkus.oidc.credentials.secret + keycloak.admin.client-secret
#   AUTH_SECRET                        → Next.js AUTH_SECRET (managed separately)
#
# Docker Compose Vault setup: see docker-compose.vault.yml
# Secret rotation runbook: see keycloak/SECRET_ROTATION.md

portal.license.key=${LICENSE_KEY:}

# ── S3 / Zenko CloudServer (task file storage) ─────────────────────────────
# Klient S3 skonfigurowany ręcznie w S3FileStorageService (AWS SDK v2 bez Quarkiverse extension).
# Zmienne środowiskowe: S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET
portal.s3.endpoint=${S3_ENDPOINT:http://localhost:8000}
portal.s3.access-key=${S3_ACCESS_KEY:quatrion-s3-key}
portal.s3.secret-key=${S3_SECRET_KEY:quatrion-s3-secret}
portal.s3.bucket=${S3_BUCKET:quatrion-tasks}

# Rate limiter — proxy header trust (false by default to prevent IP spoofing).
# Set to true ONLY when behind a trusted reverse proxy that strips client XFF headers.
# See: RateLimitFilter.kt for security implications.
portal.rate-limit.trust-proxy-headers=${PORTAL_RATE_LIMIT_TRUST_PROXY:false}

# -- Native Image (GraalVM / Mandrel) ------------------------------------------
# Native builds are NOT enabled by default in the prod profile.
# They must be triggered explicitly via Dockerfile.native (which passes
# -Dquarkus.native.enabled=true -Dquarkus.native.container-build=false).
# In JVM mode (dev / test / prod) these properties are ignored unless
# quarkus.native.enabled=true is passed on the command line.
%native.quarkus.native.enabled=true
%native.quarkus.native.additional-build-args=\
  --initialize-at-build-time=org.slf4j,\
  -H:+ReportExceptionStackTraces
# Reduce native binary size by stripping debug symbols in release builds
%native.quarkus.native.debug.enabled=false

quarkus.devservices.enabled=false