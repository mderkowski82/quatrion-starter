# =============================================================================
# quatrion-starter — Full stack (production-like)
#
# Starts: PostgreSQL + Keycloak + Backend (built locally) + Frontend (image)
#
# Usage:
#   cp .env.example .env          # fill in your values
#   docker compose up
#
# Frontend image: ghcr.io/mderkowski82/quatrion-portal-frontend
# Pin a version via FRONTEND_VERSION in .env, or use 'latest'.
#
# URLs:
#   Frontend  : http://localhost:3000
#   Backend   : http://localhost:8080
#   Swagger   : http://localhost:8080/q/swagger-ui
#   Keycloak  : http://localhost:8180
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: ${PORTAL_DB_USER:-portal}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_DB_USER:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${PORTAL_DB_USER:-portal}
      KC_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend (Quarkus — built from local source) ───────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORTAL_DB_URL: "vertx-reactive:postgresql://postgres:5432/portal"
      PORTAL_DB_USER: ${PORTAL_DB_USER:-portal}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
      PORTAL_CORS_ORIGINS: "http://localhost:3000"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_BACKEND_CLIENT_ID: "quatrion-backend"
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-quatrion-backend-dev-secret}
      LICENSE_KEY: ${LICENSE_KEY}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js — pulled image, no local sources needed) ────────────
  frontend:
    image: ghcr.io/mderkowski82/quatrion-portal-frontend:${FRONTEND_VERSION:-latest}
    environment:
      BACKEND_URL: "http://backend:8080"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-quatrion}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-quatrion-frontend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-quatrion-frontend-dev-secret}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/csrf || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:

